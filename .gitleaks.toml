title = "suzuken/dotfiles — pre-public-push checks (generic, CI-portable)"

# Keep all of gitleaks' built-in secret rules (API keys, tokens, private keys, ...)
# and layer GENERIC personal rules on top. This config is committed to a PUBLIC
# repo and runs in CI, so it must not contain employer-specific identifiers.
#
# Company-confidential rules (employer domains / legal names) live in the
# age-encrypted overlay that decrypts to ~/.config/gitleaks/company.toml
# ("engine public, data local"). The pre-push hook prefers that overlay when
# present; CI falls back to this generic config. See hooks/pre-push and the
# leak-scan skill.
[extend]
useDefault = true

# --- generic personal rules -------------------------------------------------

[[rules]]
id = "absolute-home-path"
description = "Absolute /Users/<username> path — leaks OS username / employee ID"
regex = '''/Users/[^/\s"']{3,}/'''
tags = ["personal"]

[[rules]]
id = "jp-confidentiality-marker"
description = "Japanese confidentiality marker on a document"
regex = '''社外秘|部外秘|取扱注意|社内限り|マル秘|㊙'''
tags = ["confidential"]

# --- allowlist --------------------------------------------------------------
[allowlist]
description = "false positives intrinsic to this repo"
paths = [
  # Any gitleaks config necessarily contains the trigger regexes it detects,
  # so the config files match their own rules. Covers .gitleaks.toml and the
  # leak-scan skill's bundled gitleaks.toml.
  '''(^|/)\.?gitleaks\.toml$''',
]
regexes = [
  # Keychain helper references: a NAME, never a value. See dot_zshrc.
  '''\$\(secret [A-Z_]+\)''',
]
