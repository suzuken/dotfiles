<!-- 表紙 (反転ヒーロー)。右の .diagram に hero SVG を置くと締まる。不要なら 1 カラムに -->
<header class="cover">
  <div>
    <div class="eyebrow">__EYEBROW__</div>
    <h1>__TITLE__</h1>
    <p class="sub">__SUBTITLE__</p>
    <div class="meta">
      <span><b>日時</b> __DATE__</span>
      <span><b>対象</b> __AUDIENCE__</span>
    </div>
  </div>
  <figure class="diagram">
    <!-- hero SVG (currentColor 基準)。例: 1 枚絵で資料の主張を要約する -->
    <svg viewBox="0 0 320 200" role="img" aria-label="hero">
      <rect x="0" y="0" width="320" height="200" fill="none"/>
      <text x="160" y="104" text-anchor="middle" font-size="13" fill="currentColor" opacity=".6">hero diagram</text>
    </svg>
    <figcaption>__HERO_CAPTION__</figcaption>
  </figure>
</header>
